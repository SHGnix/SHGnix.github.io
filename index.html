<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SHG Repo iOS 软件源，由 SHG 维护，面向 RootHide 与 Sileo。">
  <title>SHG Repo</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(100%,680px)}h1{font-size:2rem;margin-bottom:8px}.muted{opacity:.72}
    .repo-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
    .repo-avatar{width:58px;height:58px;border-radius:15px;object-fit:cover}
    .source{padding:14px 16px;border:1px solid rgba(127,127,127,.35);border-radius:12px;overflow-wrap:anywhere}
    article{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid rgba(127,127,127,.25)}
    article img{width:58px;height:58px;border-radius:12px;object-fit:cover}a{color:#8b7bdf}
  </style>
</head>
<body>
  <main>
    <header class="repo-head">
      <img class="repo-avatar" src="CydiaIcon.png" alt="SHGnix GitHub 头像">
      <div>
        <h1>SHG Repo</h1>
        <p class="muted">个人 iOS 越狱软件源 · 作者与维护者：SHG</p>
      </div>
    </header>
    <h2>添加软件源</h2>
    <p class="source">https://shgnix.github.io/repo/</p>
    <p class="muted">在 Sileo 中添加以上地址，然后刷新软件源。</p>
    <h2>当前插件</h2>
    <article>
      <img src="icons/pref-label-keeper.png" alt="名称保护插件图标">
      <div>
        <strong>名称保护（Roothide）</strong>
        <div class="muted">插件版本 1.3.0 · Debian 包版本 1.3.0-2 · 作者 SHG</div>
        <a href="depictions/local.preference-label-keeper-1.3.0-2.html">查看插件介绍</a>
      </div>
    </article>
    <p><a href="https://github.com/SHGnix/repo">GitHub 仓库</a></p>
  </main>
</body>
</html>
