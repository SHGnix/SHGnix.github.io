<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>名称保护（Roothide）</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;padding:24px;line-height:1.65;max-width:760px;margin-inline:auto}
    h1{font-size:1.5rem;margin:0 0 16px}
    p{margin:0 0 16px}
    dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
    dt{opacity:.72}
    dd{margin:0}
  </style>
</head>
<body>
  <h1>名称保护（Roothide）</h1>
  <p>用于保留的所选插件的偏好设置名称，减少插件更新或刷新后名称被覆盖的情况。</p>
  <dl>
    <dt>插件版本</dt>
    <dd>1.3.0</dd>
    <dt>作者</dt>
    <dd>SHG</dd>
  </dl>
</body>
</html>
