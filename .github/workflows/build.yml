
name: Build Sileo Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Generate Packages
        run: |
          if compgen -G "debs/*.deb" > /dev/null; then
            dpkg-scanpackages -m debs /dev/null > Packages
          else
            touch Packages
          fi
          gzip -9fk Packages

      - name: Generate Release
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="SHGnix" \
            -o APT::FTPArchive::Release::Label="SHGnix Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="SHGnix iOS Repository" \
            release . > Release
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
