name: Build Sileo Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils python3-pil

      - name: Build package display-name and icon revision
        run: |
          python3 scripts/rebuild-display-package.py \
            debs/pref-label-keeper_1.3.0-1_SHG_iphoneos-arm64e.deb \
            debs/pref-label-keeper_1.3.0-2_SHG_iphoneos-arm64e.deb

      - name: Fetch SHGnix GitHub avatar as repository icon
        run: |
          curl -fsSL --retry 3 "https://avatars.githubusercontent.com/u/160029720?s=512&v=4" -o /tmp/shgnix-avatar
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          image = Image.open("/tmp/shgnix-avatar").convert("RGBA")
          width, height = image.size
          side = min(width, height)
          left = (width - side) // 2
          top = (height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          image = image.resize((512, 512), Image.Resampling.LANCZOS)
          image.save("CydiaIcon.png", format="PNG", optimize=True)
          print("Generated CydiaIcon.png:", Image.open("CydiaIcon.png").size)
          PY
          file CydiaIcon.png

      - name: Extract the selected package icon
        run: |
          selected=""
          selected_version=""
          for deb in debs/*.deb; do
            [ -f "$deb" ] || continue
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            if [ "$package" = "local.preference-label-keeper" ]; then
              if [ -z "$selected" ] || dpkg --compare-versions "$version" gt "$selected_version"; then
                selected="$deb"
                selected_version="$version"
              fi
            fi
          done
          if [ -z "$selected" ]; then
            echo "No local.preference-label-keeper package found" >&2
            exit 1
          fi
          mkdir -p /tmp/preference-label-keeper-icon
          dpkg-deb -x "$selected" /tmp/preference-label-keeper-icon
          icon="$(find /tmp/preference-label-keeper-icon -path '*/PreferenceLabelKeeper.bundle/icon.png' -print -quit)"
          if [ -z "$icon" ]; then
            echo "The selected package does not contain its expected icon.png" >&2
            exit 1
          fi
          install -D "$icon" icons/pref-label-keeper.png
          file icons/pref-label-keeper.png

      - name: Generate and validate Packages
        run: |
          shopt -s nullglob
          debs=(debs/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "No Debian packages found in debs/" >&2
            exit 1
          fi
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          python3 scripts/enrich-packages.py Packages metadata/packages.json
          gzip -9fk Packages

      - name: Generate Release
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="SHGnix" \
            -o APT::FTPArchive::Release::Label="SHG Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="SHG Repo iOS Repository" \
            release . > Release
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
