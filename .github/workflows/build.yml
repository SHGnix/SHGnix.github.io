name: Build Sileo Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils librsvg2-bin

      - name: Render package icons
        run: |
          rsvg-convert -w 128 -h 128 icons/pref-label-keeper.svg > icons/pref-label-keeper.png
          file icons/pref-label-keeper.png

      - name: Generate and validate Packages
        run: |
          shopt -s nullglob
          debs=(debs/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "No Debian packages found in debs/" >&2
            exit 1
          fi
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          python3 scripts/enrich-packages.py Packages metadata/packages.json
          gzip -9fk Packages

      - name: Generate Release
        run: |
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="SHGnix" \
            -o APT::FTPArchive::Release::Label="SHGnix Repo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="ios" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="SHGnix iOS Repository" \
            release . > Release
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
